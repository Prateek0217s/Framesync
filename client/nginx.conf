# FrameSync static host + reverse proxy.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Vite emits an immutable-hashed /assets/* — cache hard, everything else
  # revalidates so deploys show up immediately.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # REST API -> api service (same-origin, no CORS surface).
  location /api/ {
    proxy_pass http://api:5001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io — needs the WebSocket upgrade handshake.
  location /socket.io/ {
    proxy_pass http://api:5001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA routing — every unknown path serves the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
