<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/framesync.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameSync — Video Review & Conditional Delivery</title>
    <script>
      // Apply the persisted (or system) theme before first paint so the app
      // never flashes the wrong shell (PDD Phase 8 theme system).
      (function () {
        try {
          var t = localStorage.getItem('fs-theme');
          if (
            t === 'light' ||
            (!t && window.matchMedia('(prefers-color-scheme: light)').matches)
          ) {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          /* private mode etc. — fall back to the dark default */
        }
      })();
    </script>
    <meta
      name="description"
      content="Enterprise video collaboration, vector frame annotation, and conditional master delivery for post-production studios."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
