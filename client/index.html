<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameSync — Video Review & Conditional Delivery</title>
    <script>
      // Apply the persisted (or system) theme before first paint so the app
      // never flashes the wrong shell. Default is the Coral & Cream
      // neobrutalist theme (`html.light`); saved 'dark' gets Dark Brut.
      (function () {
        try {
          var t = localStorage.getItem('fs-theme');
          if (
            t === 'dark' ||
            (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            return; // Dark Brut = unclassed :root
          }
          document.documentElement.classList.add('light');
        } catch (e) {
          /* private mode etc. — fall back to the cream default */
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <meta
      name="description"
      content="Enterprise video collaboration, vector frame annotation, and conditional master delivery for post-production studios."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
