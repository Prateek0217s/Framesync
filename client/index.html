<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameSync — Video Review & Conditional Delivery</title>
    <script>
      // Apply the persisted theme before first paint so the app never
      // flashes the wrong shell. Default is Dark Brut (`:root`, unclassed)
      // so the Light Ripple shader backdrop is visible everywhere; the
      // cream Coral & Cream theme (`html.light`) paints over the canvas.
      (function () {
        try {
          var t = localStorage.getItem('fs-theme');
          if (t === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          /* private mode etc. — fall back to the dark ripple default */
        }
      })();
    </script>
    <meta
      name="description"
      content="Enterprise video collaboration, vector frame annotation, and conditional master delivery for post-production studios."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Google Identity Services — powers the "Continue with Google" button on
         the login page. Loaded lazily (async defer) so it never blocks first
         paint; AdminLogin waits for window.google before rendering the button.
         No COOP/COEP is set (see vite.config.js), so this cross-origin script
         is unaffected. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
